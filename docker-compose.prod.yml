# Lapse API — production deploy for Dokploy on the VPS.
#   Routes: lapse.cecko.dev/api, /realtime, /docs  →  this api container.
#   Postgres stays on the internal `database` network (not exposed).
#   Set secrets in Dokploy → Environment (env_file: .env.prod) — do NOT commit.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lapse-api
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://lapse:${POSTGRES_PASSWORD}@db:5432/lapse?schema=public
    networks:
      - web
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      # HTTP → HTTPS redirect router (shared with the web service via same Host)
      - "traefik.http.routers.lapse-api.rule=Host(`lapse.cecko.dev`) && (PathPrefix(`/api`) || PathPrefix(`/realtime`) || PathPrefix(`/docs`))"
      - "traefik.http.routers.lapse-api.entrypoints=web"
      - "traefik.http.routers.lapse-api.middlewares=lapse-api-redirect"
      - "traefik.http.routers.lapse-api.priority=100"

      # HTTPS router
      - "traefik.http.routers.lapse-api-secure.rule=Host(`lapse.cecko.dev`) && (PathPrefix(`/api`) || PathPrefix(`/realtime`) || PathPrefix(`/docs`))"
      - "traefik.http.routers.lapse-api-secure.entrypoints=websecure"
      - "traefik.http.routers.lapse-api-secure.tls.certresolver=myresolver"
      - "traefik.http.routers.lapse-api-secure.priority=100"

      # Service
      - "traefik.http.services.lapse-api.loadbalancer.server.port=3000"

      # Redirect middleware
      - "traefik.http.middlewares.lapse-api-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lapse-api-redirect.redirectscheme.permanent=true"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: lapse-db
    environment:
      POSTGRES_USER: lapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lapse
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "synchronous_commit=off"
    volumes:
      - type: bind
        source: /volumes/lapse-api/pgdata
        target: /var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapse -d lapse"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  web:
    external: true
  database:
    external: true
