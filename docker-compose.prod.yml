# Lapse API — production deploy for Dokploy on the VPS.
#   Routes: lapse.cecko.dev/api, /realtime, /docs  →  this api container.
#   Postgres: shared Dokploy service `postgres-connect-digital-driver-ps9hl6`
#   on the `dokploy-network` overlay. Env injected by Dokploy.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lapse-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://lapse:${POSTGRES_PASSWORD}@postgres-connect-digital-driver-ps9hl6:5432/lapse?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DEFAULT: ${JWT_REFRESH_TTL_DEFAULT:-7d}
      JWT_REFRESH_TTL_STAY: ${JWT_REFRESH_TTL_STAY:-90d}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_URL: ${APP_URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.lapse-api.rule=Host(`lapse.cecko.dev`) && (PathPrefix(`/api`) || PathPrefix(`/realtime`) || PathPrefix(`/docs`))"
      - "traefik.http.routers.lapse-api.entrypoints=web"
      - "traefik.http.routers.lapse-api.middlewares=lapse-api-redirect"
      - "traefik.http.routers.lapse-api.priority=100"

      # HTTPS router
      - "traefik.http.routers.lapse-api-secure.rule=Host(`lapse.cecko.dev`) && (PathPrefix(`/api`) || PathPrefix(`/realtime`) || PathPrefix(`/docs`))"
      - "traefik.http.routers.lapse-api-secure.entrypoints=websecure"
      - "traefik.http.routers.lapse-api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lapse-api-secure.priority=100"

      # Service
      - "traefik.http.services.lapse-api.loadbalancer.server.port=3000"

      # Redirect middleware
      - "traefik.http.middlewares.lapse-api-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lapse-api-redirect.redirectscheme.permanent=true"
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
